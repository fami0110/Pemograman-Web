<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMPUS-Mini | Login Petugas</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <h1>SIMPUS-Mini</h1>
      <input type="checkbox" class="nav-toggle" id="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
      <nav>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="buku/list.html">Daftar Buku</a></li>
          <li><a href="buku/tambah.html">Tambah Buku</a></li>
          <li><a href="anggota/list.html">Daftar Anggota</a></li>
          <li><a href="anggota/tambah.html">Tambah Anggota</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Login Petugas</h2>
        <form action="#" method="post">
          <p>
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Masukkan username"
              required
            />
          </p>
          <p>
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              required
            />
          </p>
          <p>
            <button type="submit">Masuk</button>
          </p>
          <p>
            Belum punya akun? <a href="#">Daftar di sini</a>
          </p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4</p>
    </footer>
  </body>
</html>
